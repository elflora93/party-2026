  button { border:0; background:#f5b700; color:#222; font-weight:600; cursor:pointer; }

  const f = document.getElementById('f'); f.textContent = 'Prüfe …';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b(D.s), iterations:D.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
